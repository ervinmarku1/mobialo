<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>/* Hidden until the page shows the visitor's language (locale.js; 1.2 s at most). */(function(d){var l='';try{l=localStorage.getItem('mobialo-language-choice')||(sessionStorage.getItem('mobialo-detected-language')||'').split(':')[0]}catch(e){}if(l!==d.lang){d.classList.add('lang-pending');setTimeout(function(){d.classList.remove('lang-pending')},1200)}})(document.documentElement)</script><script src="/locale.js"></script><meta name="robots" content="noindex"><title>Page not found · MOBIALO</title><link rel="icon" href="/brand-mark.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/quick-links.css"><script src="/quick-links.js" defer></script><style>.missing-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.missing-main p{color:var(--muted);max-width:560px}</style></head>

<script>
// Vercel serves this page for every unknown address, so links and assets use absolute paths.
document.addEventListener('DOMContentLoaded',()=>window.MobialoLocale.ready.then(language=>{
 const copy={en:['Page not found','This page does not exist or has moved.','Go to the homepage','Find your eSIM','Help: support@mobialo.eu'],sq:['Faqja nuk u gjet','Kjo faqe nuk ekziston ose është zhvendosur.','Shko te faqja kryesore','Gjej eSIM-in tënd','Ndihmë: support@mobialo.eu'],it:['Pagina non trovata','Questa pagina non esiste o è stata spostata.','Vai alla home page','Trova la tua eSIM','Assistenza: support@mobialo.eu']}[language]||[];
 if(!copy.length)return;document.documentElement.lang=language;document.title=copy[0]+' · MOBIALO';
 ['missing-title','missing-text','missing-home','missing-esim','missing-help'].forEach((id,i)=>document.getElementById(id).textContent=copy[i]);
 const select=document.getElementById('missing-language');window.MobialoLocale.syncSelect(select,language);
 select.onchange=()=>{window.MobialoLocale.choose(select.value);location.reload();};
}));
