<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>/* Hidden until the page shows the visitor's language (locale.js; 1.2 s at most). */(function(d){var l='';try{l=localStorage.getItem('mobialo-language-choice')||(sessionStorage.getItem('mobialo-detected-language')||'').split(':')[0]}catch(e){}if(l!==d.lang){d.classList.add('lang-pending');setTimeout(function(){d.classList.remove('lang-pending')},1200)}})(document.documentElement)</script><script src="/locale.js"></script><script>/* A stored session: the header says "My account" from the first paint. */try{for(var i=0;i<localStorage.length;i++)if(/^sb-.+-auth-token$/.test(localStorage.key(i))){document.documentElement.classList.add('signed-in');break}}catch(e){}</script><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Payment status · MOBIALO</title><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/brand-mark.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/styles.css"></head><body>
<header class="header wrap"><a href="/" class="logo" aria-label="MOBIALO home"><img class="brand-mark" src="/brand-mark.svg" width="42" height="42" alt=""><span class="brand-word">mobialo<span class="brand-domain">.eu</span></span></a><div class="header-actions"><a href="/sign-in" class="account-link" target="_blank" rel="noopener"><span class="account-out" data-i18n="signIn">Sign in</span><span class="account-in" data-i18n="myAccount">My account</span></a></div></header>
<script>/* The label already follows html.signed-in (set in <head>); a stored session only changes where the link goes. */if(document.documentElement.classList.contains('signed-in'))document.querySelector('.account-link').href='/account';</script>
<main class="payment-main wrap"><h1 data-l10n="title">Payment status</h1><p id="payment-status" role="status">Checking payment…</p><button class="button" id="retry" hidden data-l10n="retry">Retry</button><p><a class="text-link" href="/" data-l10n="back">← Back to MOBIALO</a></p></main>
<script>
// Static labels follow the shopper's language; payment.js writes the status itself. The sign-in link opens a new tab so this tab keeps the payment to verify.
document.addEventListener('DOMContentLoaded',()=>window.MobialoLocale?.ready.then(lang=>{const copy={en:{title:'Payment status',retry:'Retry',back:'← Back to MOBIALO',signIn:'Sign in',myAccount:'My account'},sq:{title:'Statusi i pagesës',retry:'Provo përsëri',back:'← Kthehu te MOBIALO',signIn:'Hyr',myAccount:'Llogaria ime'},it:{title:'Stato del pagamento',retry:'Riprova',back:'← Torna a MOBIALO',signIn:'Accedi',myAccount:'Il mio account'}}[lang]||{};document.documentElement.lang=lang;document.querySelectorAll('[data-l10n],[data-i18n]').forEach(node=>{const text=copy[node.dataset.l10n||node.dataset.i18n];if(text)node.textContent=text;});if(copy.title)document.title=copy.title+' · MOBIALO';}));
</script>
<script type="module" src="/payment.js"></script></body></html>
