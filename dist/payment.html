<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Payment status · MOBIALO</title><link rel="icon" href="/brand-mark.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap"><link rel="stylesheet" href="/styles.css"><script src="/locale.js" defer></script></head><body>
<header class="header wrap"><a href="/" class="logo" aria-label="MOBIALO home"><img class="brand-mark" src="/brand-mark.svg" width="42" height="42" alt=""><span class="brand-word">mobialo<span class="brand-domain">.eu</span></span></a><div class="header-actions"><a href="/sign-in" class="account-link" target="_blank" rel="noopener" data-i18n="signIn">Sign in</a></div></header>
<main class="payment-main wrap"><h1 data-l10n="title">Payment status</h1><p id="payment-status" role="status">Checking payment…</p><button class="button" id="retry" hidden data-l10n="retry">Retry</button><p><a class="text-link" href="/" data-l10n="back">← Back to MOBIALO</a></p></main>
<script>
// Static labels follow the shopper's language; payment.js writes the status itself. The sign-in link opens a new tab so this tab keeps the payment to verify.
document.addEventListener('DOMContentLoaded',()=>window.MobialoLocale?.ready.then(lang=>{const copy={en:{title:'Payment status',retry:'Retry',back:'← Back to MOBIALO',signIn:'Sign in'},sq:{title:'Statusi i pagesës',retry:'Provo përsëri',back:'← Kthehu te MOBIALO',signIn:'Hyr'},it:{title:'Stato del pagamento',retry:'Riprova',back:'← Torna a MOBIALO',signIn:'Accedi'}}[lang]||{};document.documentElement.lang=lang;document.querySelectorAll('[data-l10n],[data-i18n]').forEach(node=>{const text=copy[node.dataset.l10n||node.dataset.i18n];if(text)node.textContent=text;});if(copy.title)document.title=copy.title+' · MOBIALO';}));
</script>
<script type="module" src="/payment.js"></script></body></html>
